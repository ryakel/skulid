# Builds the skulid container, tests it, and publishes to GHCR plus an
# optional internal registry. Mirrors the structure of
# ryakel/boomerang/.github/workflows/build-and-publish.yml so the same
# patterns work across both repos.
#
# What runs when:
#   * PR to main          : Go vet + tests + multi-arch build (no push)
#   * push to main        : full pipeline; auto-bumps a semver tag from
#                           conventional commit messages, pushes :latest
#                           and :vX.Y.Z to GHCR + internal registry, and
#                           triggers a Portainer redeploy webhook.
#   * push of vX.Y.Z tag  : pushes a single :vX.Y.Z image (no version
#                           bump, no release).
#   * workflow_dispatch   : same as push to main.
#
# Optional repository secrets — the matching steps are skipped when the
# value is empty, so the workflow is a no-op for these on first install:
#   INTERNAL_REGISTRY            registry hostname (e.g. registry.home.lan:5000)
#   INTERNAL_REGISTRY_USERNAME   login user
#   INTERNAL_REGISTRY_PASSWORD   login password / token
#   PORTAINER_WEBHOOK_URL        full Portainer service-update webhook URL
#   TS_OAUTH_CLIENT_ID           Tailscale OAuth client (only needed if
#   TS_OAUTH_SECRET              the internal registry / Portainer live
#                                inside a Tailnet)

name: Build and publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**/*.md"
      - "wiki/**"
      - "LICENSE*"
      - ".gitignore"
      - "CLAUDE.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "wiki/**"
      - "LICENSE*"
      - ".gitignore"
      - "CLAUDE.md"

permissions:
  contents: write
  actions: write
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: "1.26"

jobs:
  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # govulncheck reports only vulnerabilities actually reachable from this
      # code, so it is low-noise enough to fail on rather than merely report.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  # Postgres-backed tests. These exist because every repo is hand-written SQL
  # with no compile-time checking, and because migrations 0011 and 0012 reached
  # production having never been run against a real server. `docker` needs this
  # job, so a migration that fails to apply can never publish an image.
  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Without this the job races the container's first-boot initdb.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Each test creates and drops a database of its own off this DSN, so it
      # points at the maintenance database rather than a fixture.
      - name: Test
        env:
          SKULID_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: go test -race -count=1 ./...

  docker:
    needs: integration
    runs-on: ubuntu-latest
    env:
      INTERNAL_REGISTRY: ${{ secrets.INTERNAL_REGISTRY }}
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Set Docker tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "is_tag_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "is_tag_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and push tag
        id: bump
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          custom_release_rules: |
            major:major,
            breaking:major,
            minor:minor,
            feat:minor,
            patch:patch,
            fix:patch

      - name: Create GitHub release
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.bump.outputs.new_tag != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.bump.outputs.new_tag }}
          name: ${{ steps.bump.outputs.new_tag }}
          body: ${{ steps.bump.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to internal registry
        if: |
          github.event_name != 'pull_request' &&
          env.INTERNAL_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.INTERNAL_REGISTRY }}
          username: ${{ secrets.INTERNAL_REGISTRY_USERNAME }}
          password: ${{ secrets.INTERNAL_REGISTRY_PASSWORD }}

      - name: Compute image tags
        id: tags
        if: github.event_name != 'pull_request'
        run: |
          set -e
          tags=()
          # Tag-push: a single immutable image keyed off the git tag.
          if [[ "${{ steps.tag.outputs.is_tag_push }}" == "true" ]]; then
            v="${{ steps.tag.outputs.tag }}"
            tags+=("${REGISTRY}/${IMAGE_NAME}:${v}")
            if [[ -n "${INTERNAL_REGISTRY}" ]]; then
              tags+=("${INTERNAL_REGISTRY}/${IMAGE_NAME}:${v}")
            fi
            echo "app_version=${v}" >> "$GITHUB_OUTPUT"
          else
            # main-push (or workflow_dispatch on main): :latest + :vX.Y.Z
            v="${{ steps.bump.outputs.new_tag }}"
            if [[ -z "${v}" ]]; then v="latest"; fi
            tags+=("${REGISTRY}/${IMAGE_NAME}:latest")
            tags+=("${REGISTRY}/${IMAGE_NAME}:${v}")
            if [[ -n "${INTERNAL_REGISTRY}" ]]; then
              tags+=("${INTERNAL_REGISTRY}/${IMAGE_NAME}:latest")
              tags+=("${INTERNAL_REGISTRY}/${IMAGE_NAME}:${v}")
            fi
            echo "app_version=${v}" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build (PR — no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Loaded into the local daemon so Trivy has something to scan.
          # Single-platform because `load` cannot take a manifest list.
          load: true
          tags: skulid:pr-scan
          platforms: linux/amd64
          cache-from: type=gha

      # Image scanning is report-only. The Go dependency story is already
      # gated by govulncheck above; what this adds is the distroless base,
      # where a CVE often has no fix available yet — and refusing to deploy
      # over an unfixable base CVE is its own kind of outage.
      - name: Scan image (PR)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: skulid:pr-scan
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Scan image (published)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.app_version }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "0"

      # continue-on-error so a repo without code scanning enabled cannot
      # redden a build over a reporting side-channel.
      - name: Upload image scan results
        if: always() && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Connect to Tailscale
        if: |
          github.event_name != 'pull_request' &&
          env.TS_OAUTH_CLIENT_ID != ''
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trigger Portainer redeploy
        if: |
          github.event_name != 'pull_request' &&
          env.PORTAINER_WEBHOOK_URL != ''
        run: |
          curl -fsS -X POST "${PORTAINER_WEBHOOK_URL}" \
            -H 'Content-Type: application/json' \
            --data "{\"image\":\"${REGISTRY}/${IMAGE_NAME}:${{ steps.tags.outputs.app_version }}\"}"
